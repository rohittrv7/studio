name: mobile
description: Photography Studio QR Gallery — Flutter mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation / routing
  go_router: ^13.2.0

  # HTTP client
  dio: ^5.4.3

  # Local storage / caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^2.31.1
  firebase_auth: ^4.19.6
  firebase_messaging: ^14.9.4

  # QR scanning
  mobile_scanner: ^5.1.1

  # Image / video
  cached_network_image: ^3.3.1
  video_player: ^2.8.6
  chewie: ^1.8.1

  # Connectivity monitoring
  connectivity_plus: ^6.0.0

  # File system / permissions
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  file_picker: ^8.0.3
  cupertino_icons: ^1.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
